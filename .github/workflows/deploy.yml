name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (defaults to last successful CI SHA)'
        required: false
        default: ''

env:
  AWS_REGION: 'ap-northeast-1'
  DOCKER_IMAGE: menyu168/fraud-detection

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            LAST_SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&per_page=1&branch=main" \
              | jq -r '.workflow_runs[0].head_sha')
            echo "tag=${LAST_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install fraud-detection ./charts/fraud-detection \
            -f ./charts/fraud-detection/values-prod.yaml \
            --namespace fraud-detection --create-namespace \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ steps.resolve.outputs.tag }} \
            --set imagePullSecrets[0].name=dockerhub-secret \
            --set database.password=${{ secrets.DB_PASSWORD }} \
            --wait --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/fraud-detection -n fraud-detection --timeout=3m
