spring:
  datasource:
    url: jdbc:h2:mem:frauddetection;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  cloud:
    aws:
      endpoint: http://localhost:4566
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        enabled: true
      sns:
        enabled: false

fraud:
  rules:
    threshold: 70
    list:
      - name: "amount-threshold"
        condition: "amount > 100000"
        score: 40
        alertMessage: "Large amount transaction detected"
        enabled: true
      - name: "suspicious-payer-account"
        condition: "#riskCache.isSuspiciousAccount(accountId)"
        score: 80
        alertMessage: "Payer account is blacklisted"
        enabled: true

sqs:
  queue-name: fraud-transactions-test

sns:
  topic-arn: ""

logging:
  level:
    com.frauddetection: DEBUG
