spring:
  datasource:
    url: jdbc:h2:mem:fraudfinder;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    aws:
      sqs:
        enabled: false
      sns:
        enabled: false

fraud:
  detection:
    threshold: 70
  auth:
    enabled: false

logging:
  level:
    com.frauddetection: DEBUG
