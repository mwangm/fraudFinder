server:
  shutdown: graceful

spring:
  application:
    name: fraud-detection

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-1}
      sqs:
        enabled: true
        auto-create-queue: false

# ── Rule Engine ──
fraud:
  rules:
    threshold: 70
    list:
      - name: "大额交易"
        condition: "amount > 100000"
        score: 40
        alertMessage: "Large amount transaction detected"
        enabled: true
      - name: "付款方黑名单"
        condition: "{'ACC-BAD','ACC-FRAUD','ACC-SCAM'}.contains(accountId)"
        score: 80
        alertMessage: "Payer account is blacklisted"
        enabled: true
      - name: "收款方高风险"
        condition: "{'PE-HIGH','PE-RISK'}.contains(payeeId)"
        score: 60
        alertMessage: "Payee is high risk"
        enabled: true

# ── SNS ──
sns:
  topic-arn: ${SNS_TOPIC_ARN:}

# ── AWS SQS ──
sqs:
  queue-name: ${SQS_QUEUE_NAME:fraud-transactions}

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
