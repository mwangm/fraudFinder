server:
  shutdown: graceful

spring:
  application:
    name: fraud-detection

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:frauddetection;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-1}
      sqs:
        enabled: true
        auto-create-queue: false

# Rule Engine
fraud:
  rules:
    threshold: 70
    list:

# SNS
sns:
  topic-arn: ${SNS_TOPIC_ARN:}

# AWS SQS
sqs:
  queue-name: ${SQS_QUEUE_NAME:fraud-transactions}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
