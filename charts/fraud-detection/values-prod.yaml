# Production values — AWS ap-northeast-1
# Usage: helm install fraud-detection ./charts/fraud-detection -f charts/fraud-detection/values-prod.yaml

replicaCount: 2

image:
  repository: menyu168/fraud-detection
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub-secret

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8

aws:
  region: ap-northeast-1

sqs:
  queueName: fraud-transactions
  dlqName: fraud-transactions-dlq

sns:
  topicArn: arn:aws:sns:ap-northeast-1:774075583755:fraud-detection-alerts

database:
  host: fraud-detection.cbsc0y0qo9f6.ap-northeast-1.rds.amazonaws.com
  port: 3306
  name: fraud_finder
  username: fraudFinder
  password: ""  # Set via: --set database.password=xxx

fraud:

probes:
  readiness:
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 20
    failureThreshold: 3
